[package]
name = "mcs51-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "MCP server for the 8051 (MCS-51) development loop: SDCC toolchain, stcgal flashing, and serial sessions."
repository = "https://github.com/shashwatraj/mcp8051"
readme = "README.md"
keywords = ["mcp", "8051", "mcs51", "sdcc", "embedded"]
categories = ["development-tools", "embedded"]

[dependencies]
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "time",
    "sync",
    "io-util",
    "io-std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serialport = "4"
thiserror = "2"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
strip = true
